# Сборка debug-APK на GitHub Actions.
# Триггер: push/commit. Результат — .apk как artifact сборки.
# Локально APK НЕ собираем (см. AGENT.md §6).
name: Build debug APK

permissions:
  contents: write

on:
  push:
    branches: [ "main", "redesign" ]
    paths:
      - 'api.py'
      - 'database.py'
      - 'services.py'
      - 'log_config.py'
      - 'main.py'
      - 'buildozer.spec'
      - 'requirements.txt'
      - 'calendar_export.py'
      - 'report_export.py'
      - 'tgbot.py'
      - 'maxbot.py'
      - 'botcore.py'
      - 'tests/**'
      - 'seed_db.py'
      - 'schedule_file.py'
      - '.github/workflows/build-apk.yml'
      - 'VERSION'
      - 'mobile-teacher-app-redesign/**'
  workflow_dispatch: {}

jobs:
  tests:
    name: Unit tests (pure logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Write VERSION from run number
        run: echo "0.${{ github.run_number }}" > VERSION
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test deps
        run: pip install pytest flask openpyxl
      - name: Run tests
        run: pytest -q

  build-apk:
    name: Build debug APK
    needs: tests
    # ubuntu-latest переехал на 26.04 с JDK 25 по умолчанию: Gradle 8.14.3
    # из python-for-android не читает class-файлы Java 25 (major version 69).
    # Держим 24.04 — среду последней зелёной сборки (v0.311, 8 ноября).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            automake autoconf libtool build-essential \
            pkg-config libc6-dev m4 libffi-dev \
            python3-dev libssl-dev libltdl-dev \
            libncurses5-dev ccache git unzip curl \
            openjdk-17-jdk

      # Явный выбор JDK 17. Раньше здесь стояло `readlink -f $(which java)`,
      # которое возвращало дефолтную JDK раннера (25), а не установленную 17.
      # JAVA_HOME + PATH указывают на 17 и для buildozer, и для gradlew,
      # и для keytool; шаг падает сразу, если JDK 17 не нашлась.
      - name: Select JDK 17
        run: |
          set -eu
          JAVA_17_HOME="${JAVA_HOME_17_X64:-}"
          if [ -z "$JAVA_17_HOME" ] || [ ! -x "$JAVA_17_HOME/bin/javac" ]; then
            JAVA_17_HOME=""
            for d in /usr/lib/jvm/java-17-openjdk-*; do
              if [ -x "$d/bin/javac" ]; then JAVA_17_HOME="$d"; break; fi
            done
          fi
          if [ -z "$JAVA_17_HOME" ]; then
            echo "::error::JDK 17 not found (checked \$JAVA_HOME_17_X64 and /usr/lib/jvm/java-17-openjdk-*)"
            ls -la /usr/lib/jvm || true
            exit 1
          fi
          echo "JAVA_HOME=$JAVA_17_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_17_HOME/bin" >> "$GITHUB_PATH"
          echo "Selected JAVA_HOME=$JAVA_17_HOME"
          "$JAVA_17_HOME/bin/java" -version

      - name: Verify Java 17 is active
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          java -version 2>&1 | grep -q 'version "17' \
            || { echo "::error::Java 17 is not the active JDK"; exit 1; }

      - name: Cache Buildozer
        uses: actions/cache@v6
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Set version from run number
        run: |
          sed -i -E "s/^version = .*/version = 0.${{ github.run_number }}/" buildozer.spec
          grep "^version = " buildozer.spec
          echo "0.${{ github.run_number }}" > VERSION
          cat VERSION

      - name: Prepare JKS keystore for signing
        run: |
          keytool -importkeystore -srckeystore release.keystore -srcstoretype PKCS12 \
            -srcstorepass teachhelper -srcalias teachhelper \
            -destkeystore android-release.jks -deststoretype JKS \
            -deststorepass teachhelper -destkeypass teachhelper \
            -destalias teachhelper -noprompt
          ls -la android-release.jks

      - name: Install Buildozer and Cython
        run: |
          # Swap: избежать OOM при компиляции Kivy под Android
          sudo fallocate -l 4G /swapfile 2>/dev/null || true
          sudo chmod 600 /swapfile 2>/dev/null || true
          sudo mkswap /swapfile 2>/dev/null || true
          sudo swapon /swapfile 2>/dev/null || true
          free -h
          # Use faster pip index and longer timeout
          pip config set global.index-url https://pypi.org/simple
          pip config set global.timeout 120
          pip config set global.retries 5
          # Retry pip install up to 5 times with longer timeout
          for i in 1 2 3 4 5; do
            pip install --user buildozer==1.6.0 cython && break
            echo "pip install failed, retry $i/5..."
            sleep 20
          done
          export PATH="$HOME/.local/bin:$PATH"
          echo "--- Tool versions ---"
          java -version 2>&1 || true
          buildozer --version 2>&1 || true
          echo "--- Build release (up to 5 attempts with backoff: savannah 502 workaround) ---"
          for attempt in 1 2 3 4 5; do
            echo "Build attempt $attempt/5"
            buildozer -v android release 2>&1 && break
            code=$?
            if [ "$attempt" -lt 5 ]; then wait_time=$((30 * attempt)); echo "Build failed, retrying in ${wait_time}s..."; sleep $wait_time; else exit $code; fi
          done

      - name: Sign release APK (stable key)
        run: |
          APKSIGNER=$(find ~/.buildozer/android/platform/android-sdk/build-tools /usr/local/lib/android/sdk/build-tools -name apksigner 2>/dev/null | head -1)
          if [ -z "$APKSIGNER" ]; then echo "apksigner not found"; exit 1; fi
          IN=$(ls bin/*-release-unsigned.apk | head -1)
          OUT=bin/teachhelper4-release-signed.apk
          "$APKSIGNER" sign --ks android-release.jks --ks-pass pass:teachhelper --key-pass pass:teachhelper --ks-key-alias teachhelper --out "$OUT" "$IN"
          rm -f "$IN"
          ls -la bin/

      - name: Verify APK signature
        run: |
          ls -la bin/
          APKSIGNER=$(find ~/.buildozer/android/platform/android-sdk/build-tools /usr/local/lib/android/sdk/build-tools -name apksigner 2>/dev/null | head -1)
          if [ -z "$APKSIGNER" ]; then echo "apksigner not found, skipping verify"; exit 0; fi
          "$APKSIGNER" verify --print-certs bin/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: teachhelper-debug
          path: bin/*.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.${{ github.run_number }}
          name: "TeachHelper v0.${{ github.run_number }}"
          body: |
            Automated build from commit ${{ github.sha }}.
            See build log for details.
          files: bin/*.apk
          generate_release_notes: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
