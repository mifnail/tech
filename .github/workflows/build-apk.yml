# Сборка debug-APK на GitHub Actions.
# Триггер: push/commit. Результат — .apk как artifact сборки.
# Локально APK НЕ собираем (см. AGENT.md §6).
name: Build debug APK

on:
  push:
    branches: [ "main" ]
    paths:
      - 'api.py'
      - 'database.py'
      - 'main.py'
      - 'buildozer.spec'
      - 'requirements.txt'
      - 'static/**'
      - 'templates/**'
      - 'calendar_export.py'
      - 'report_export.py'
      - 'yandex_publish.py'
      - 'crash_reporter.py'
      - 'seed_db.py'
      - 'schedule_file.py'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: {}

jobs:
  tests:
    name: Unit tests (pure logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test deps
        run: pip install pytest flask
      - name: Run tests
        run: pytest -q

  build-apk:
    name: Build debug APK
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            automake autoconf libtool build-essential \
            pkg-config libc6-dev m4 libffi-dev \
            python3-dev libssl-dev libltdl-dev \
            libncurses5-dev ccache git unzip curl \
            openjdk-17-jdk

      - name: Cache Buildozer
        uses: actions/cache@v6
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Prepare JKS keystore for signing
        run: |
          keytool -importkeystore -srckeystore release.keystore -srcstoretype PKCS12 \
            -srcstorepass teachhelper -srcalias teachhelper \
            -destkeystore android-release.jks -deststoretype JKS \
            -deststorepass teachhelper -destkeypass teachhelper \
            -destalias teachhelper -noprompt
          ls -la android-release.jks

      - name: Install Buildozer and Cython
        run: |
          # Swap: избежать OOM при компиляции Kivy под Android
          sudo fallocate -l 4G /swapfile 2>/dev/null || true
          sudo chmod 600 /swapfile 2>/dev/null || true
          sudo mkswap /swapfile 2>/dev/null || true
          sudo swapon /swapfile 2>/dev/null || true
          free -h
          pip install --user buildozer==1.6.0 cython
          export PATH="$HOME/.local/bin:$PATH"
          echo "--- Tool versions ---"
          java -version 2>&1 || true
          buildozer --version 2>&1 || true
          echo "--- Build release (up to 5 attempts with backoff: savannah 502 workaround) ---"
          for attempt in 1 2 3 4 5; do
            echo "Build attempt $attempt/5"
            buildozer -v android release 2>&1 && break
            code=$?
            if [ "$attempt" -lt 5 ]; then wait_time=$((30 * attempt)); echo "Build failed, retrying in ${wait_time}s..."; sleep $wait_time; else exit $code; fi
          done

      - name: Sign release APK (stable key)
        run: |
          APKSIGNER=$(find ~/.buildozer/android/platform/android-sdk/build-tools /usr/local/lib/android/sdk/build-tools -name apksigner 2>/dev/null | head -1)
          if [ -z "$APKSIGNER" ]; then echo "apksigner not found"; exit 1; fi
          IN=$(ls bin/*-release-unsigned.apk | head -1)
          OUT=bin/teachhelper4-release-signed.apk
          "$APKSIGNER" sign --ks android-release.jks --ks-pass:teachhelper --key-pass:teachhelper --ks-key-alias teachhelper --out "$OUT" "$IN"
          rm -f "$IN"
          ls -la bin/

      - name: Verify APK signature
        run: |
          ls -la bin/
          APKSIGNER=$(find ~/.buildozer/android/platform/android-sdk/build-tools /usr/local/lib/android/sdk/build-tools -name apksigner 2>/dev/null | head -1)
          if [ -z "$APKSIGNER" ]; then echo "apksigner not found, skipping verify"; exit 0; fi
          "$APKSIGNER" verify --print-certs bin/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: teachhelper-debug
          path: bin/*.apk
          if-no-files-found: error
