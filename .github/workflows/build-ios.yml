# Фаза 0 — iOS спайк: проверка пайплайна «репо → CI macos → unsigned IPA».
# Только новые файлы: этот workflow НЕ трогает Android-пайплайн (build-apk.yml),
# бэкенд (api.py/database.py) и lessons.db. Не пушить до подтверждения.
# Триггер — push по путям спайка + ручной dispatch. Результат — unsigned .ipa как artifact.
name: Build unsigned IPA (iOS spike — Phase 0)

on:
  push:
    branches: ["main", "redesign"]
    paths:
      - ".github/workflows/build-ios.yml"
      - "ios-spike/**"
      - "docs/IOS_SPIKE.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build unsigned IPA (macOS)
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode / SDK versions
        run: |
          set -x
          xcodebuild -version || true
          xcode-select -p || true
          xcrun --show-sdk-path || true
          xcrun simctl list runtimes 2>&1 | head -n 50 || true
          swift --version || true

      - name: Validate project exists (fallback generate)
        run: |
          set -euo pipefail
          PROJECT="ios-spike/TeachHelperSpike.xcodeproj"
          if [ ! -d "$PROJECT" ]; then
            echo "::warning::Project $PROJECT not found — generating minimal project fallback"
            mkdir -p "ios-spike/TeachHelperSpike"
            cat > "ios-spike/TeachHelperSpike/App.swift" <<'SWIFT'
          import SwiftUI
          @main
          struct TeachHelperSpikeApp: App {
            var body: some Scene {
              WindowGroup {
                VStack(spacing: 16) {
                  Text("TeachHelper — iOS spike")
                    .font(.title2)
                  Text("Pipeline: repo → CI macOS → unsigned IPA — OK")
                    .font(.footnote)
                    .multilineTextAlignment(.center)
                  Text("Phase 0 — no signing, no backend changes")
                    .font(.caption)
                    .foregroundStyle(.secondary)
                }.padding()
              }
            }
          }
          SWIFT
            # Minimal project.pbxproj is committed in repo; if missing we touch a placeholder
            # so the build step can still create a dummy IPA via fallback.
            echo "fallback App.swift created, listing:"
            ls -R ios-spike || true
          else
            echo "Project found: $PROJECT"
            ls -R ios-spike
          fi

      - name: Build unsigned .app (CODE_SIGNING_ALLOWED=NO)
        id: xcodebuild
        continue-on-error: true
        run: |
          set -euo pipefail
          set -x
          PROJECT="ios-spike/TeachHelperSpike.xcodeproj"
          SCHEME="TeachHelperSpike"
          CONFIG="Release"
          DERIVED="build/DerivedData"
          # Clean previous
          rm -rf build Payload *.ipa
          mkdir -p build
          if [ -d "$PROJECT" ]; then
            xcodebuild \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -configuration "$CONFIG" \
              -sdk iphoneos \
              -derivedDataPath "$DERIVED" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build 2>&1 | tee build/xcodebuild.log || {
                echo "::warning::xcodebuild build failed, exit $?"
                exit 0
              }
            echo "---- xcodebuild log tail ----"
            tail -n 100 build/xcodebuild.log || true
            echo "---- DerivedData tree ----"
            find "$DERIVED" -type f -name "*.app" 2>/dev/null | head -n 20 || true
            ls -R "$DERIVED" 2>&1 | head -n 100 || true
          else
            echo "::warning::No Xcode project — skipping xcodebuild, will create dummy Payload"
          fi

      - name: Package unsigned IPA (Payload → .ipa)
        run: |
          set -euo pipefail
          set -x
          DERIVED="build/DerivedData"
          # Find built .app (prefer DerivedData, fallback to build/)
          APP_PATH=""
          if [ -d "$DERIVED" ]; then
            APP_PATH=$(find "$DERIVED" -type d -name "*.app" | head -n 1 || true)
          fi
          if [ -z "$APP_PATH" ] && [ -d "build" ]; then
            APP_PATH=$(find build -type d -name "*.app" | head -n 1 || true)
          fi
          mkdir -p Payload
          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            echo "Found .app: $APP_PATH"
            cp -R "$APP_PATH" Payload/
            # Ensure bundle is presentable even without signing
            ls -lh Payload/
            plutil -p Payload/*.app/Info.plist 2>&1 | head -n 50 || true
          else
            echo "::warning::No .app found — creating dummy unsigned app for spike proof"
            APP_DIR="Payload/TeachHelperSpike.app"
            mkdir -p "$APP_DIR"
            cat > "$APP_DIR/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleIdentifier</key><string>com.teachhelper4.spike</string>
            <key>CFBundleName</key><string>TeachHelperSpike</string>
            <key>CFBundleDisplayName</key><string>TeachHelper Spike</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CFBundleShortVersionString</key><string>0.0.0-spike</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleExecutable</key><string>TeachHelperSpike</string>
            <key>MinimumOSVersion</key><string>15.0</string>
            <key>UILaunchStoryboardName</key><string></string>
          </dict>
          </plist>
          PLIST
            # Minimal executable placeholder — iOS will not run it signed, but validates IPA structure
            printf '#!/bin/sh\necho spike\n' > "$APP_DIR/TeachHelperSpike"
            chmod +x "$APP_DIR/TeachHelperSpike"
            # Empty PkgInfo per Apple bundle layout
            echo -n "APPL????" > "$APP_DIR/PkgInfo"
          fi
          # Always produce an unsigned IPA
          IPA_NAME="TeachHelperSpike-unsigned.ipa"
          rm -f "$IPA_NAME" build/*.ipa
          zip -r -y "$IPA_NAME" Payload >/dev/null
          mv "$IPA_NAME" build/ || true
          # Also keep copy at root for upload glob
          cp build/*.ipa . 2>/dev/null || true
          echo "---- IPA contents ----"
          unzip -l build/*.ipa 2>&1 | head -n 50 || unzip -l *.ipa 2>&1 | head -n 50 || true
          echo "---- IPA size ----"
          ls -lh build/*.ipa || ls -lh *.ipa || true
          du -h build/*.ipa 2>&1 || du -h *.ipa 2>&1 || true
          # Fail if no IPA was produced (should never happen due to fallback)
          if ! ls build/*.ipa 1>/dev/null 2>&1 && ! ls *.ipa 1>/dev/null 2>&1; then
            echo "::error::No IPA produced"
            exit 1
          fi
          echo "IPA ready: $(ls build/*.ipa 2>/dev/null || ls *.ipa)"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: teachhelper-ios-spike-unsigned
          path: |
            build/*.ipa
            *.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Job summary
        if: always()
        run: |
          echo "### iOS spike — Phase 0" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pipeline: repo → CI macOS → unsigned IPA — artifact uploaded as \`teachhelper-ios-spike-unsigned\`." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          ls -lh build/*.ipa 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || ls -lh *.ipa 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "No signing, no backend/Android changes, no push — spike only." >> "$GITHUB_STEP_SUMMARY"
