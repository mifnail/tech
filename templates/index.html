  <script>
    /* Тема light/concept: синхронно до CSS, без внешних URL и слушателей.
       localStorage['theme'] → иначе одноразовая OS-эвристика. */
    (function() {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'concept') {
        t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'concept' : 'light';
        try { localStorage.setItem('theme', t); } catch (e) {}
      }
      document.documentElement.setAttribute('data-theme', t);
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', t === 'concept' ? '#7c8cff' : '#4353e8');
    })();
  </script>
